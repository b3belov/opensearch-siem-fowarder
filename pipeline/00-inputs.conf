input {
  syslog {
    id => "input-generic-syslog"
    host => "0.0.0.0"
    port => 5514
    ecs_compatibility => "v8"
    add_field => {
      "[@metadata][forwarder][source_id]" => "generic-syslog"
      "[@metadata][forwarder][dataset]" => "generic-syslog"
      "[@metadata][forwarder][parser]" => "generic-syslog"
      "[@metadata][forwarder][observer_name]" => "customer-forwarder-01"
    }
  }
}
input {
  http {
    id => "input-windows-ad"
    host => "0.0.0.0"
    port => 8081
    codec => "json"
    max_content_length => 1048576
    user => "${WINDOWS_HTTP_USERNAME}"
    password => "${WINDOWS_HTTP_PASSWORD}"
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/http/server.crt"
    ssl_key => "/usr/share/logstash/config/http/server.pkcs8.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/http/client-ca.crt"]
    ssl_client_authentication => "required"
    add_field => {
      "[@metadata][forwarder][source_id]" => "windows-ad"
      "[@metadata][forwarder][dataset]" => "windows-ad"
      "[@metadata][forwarder][parser]" => "windows-ad-json"
      "[@metadata][forwarder][observer_name]" => "customer-forwarder-01"
    }
  }
}
input {
  http {
    id => "input-windows-sysmon"
    host => "0.0.0.0"
    port => 8082
    codec => "json"
    max_content_length => 1048576
    user => "${WINDOWS_HTTP_USERNAME}"
    password => "${WINDOWS_HTTP_PASSWORD}"
    ssl_enabled => true
    ssl_certificate => "/usr/share/logstash/config/http/server.crt"
    ssl_key => "/usr/share/logstash/config/http/server.pkcs8.key"
    ssl_certificate_authorities => ["/usr/share/logstash/config/http/client-ca.crt"]
    ssl_client_authentication => "required"
    add_field => {
      "[@metadata][forwarder][source_id]" => "windows-sysmon"
      "[@metadata][forwarder][dataset]" => "windows-sysmon"
      "[@metadata][forwarder][parser]" => "windows-sysmon-json"
      "[@metadata][forwarder][observer_name]" => "customer-forwarder-01"
    }
  }
}
output {
  pipeline {
    send_to => "parse-and-normalize"
  }
}
